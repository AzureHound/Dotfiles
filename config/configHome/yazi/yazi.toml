[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
# sort_dir_first = true
show_hidden = true
sort_sensitive = false
linemode = "size"
show_symlink = true
scrolloff = 5

[preview]
wrap = "yes"

[input]
cursor_blink = true

[opener]
folder = [
  { run = 'hyprctl dispatch exec "[float; size 60% 60%; center 1] nautilus" "$@"', orphan = true, desc = "nautilus", for = "linux" },
  { run = '''fish -c "nvim "$1""''', block = true, desc = "neovim", for = "linux" },
  { run = 'kitty --detach nvim %s1', orphan = true, desc = "neovim (detached)", for = "linux" },
  { run = '''fish -c "lazygit -p "$1""''', block = true, desc = "lazygit", for = "linux" },
  { run = 'zeditor  %s1', orphan = true, desc = "zeditor", for = "linux" },
  { run = 'kitty %s1', orphan = true, desc = "kitty", for = "linux" },
  { run = 'xdg-open %s1', orphan = true, desc = "xdg-open", for = "linux" },
]

extract = [
  { run = 'ouch d -y %s1', desc = "Extract here with ouch", for = "unix" },
]

text = [
  { run = '$EDITOR %s1', block = true, desc = "$EDITOR", for = "linux" },
  { run = 'nvim %s1', block = true, desc = "neovim", for = "linux" },
  { run = 'kitty --detach nvim %s1', block = true, desc = "neovim (detached)", for = "linux" },
  { run = 'zeditor  %s1', orphan = true, desc = "zeditor", for = "linux" },
  { run = 'xdg-open %s1', orphan = true, desc = "xdg-open", for = "linux" },
]

document = [
  { run = 'xdg-open %s1', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'zathura %s1', orphan = true, desc = "zathura", for = "linux" },
  { run = 'libreoffice %s1', orphan = true, desc = "libreoffice", for = "linux" },
]

image = [
  { run = 'swayimg %s1', orphan = true, desc = "swayimg", for = "linux" },
  { run = 'xdg-open %s1', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'satty --filename %s1', orphan = true, desc = "satty", for = "linux" },
]

audio = [
  { run = 'xdg-open %s1', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'mpv %s1', orphan = true, desc = "mpv", for = "linux" },
]

video = [
  { run = 'xdg-open %s1', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'mpv %s1', orphan = true, desc = "mpv", for = "linux" },
]

fallback = [
  { run = 'xdg-open %s1', orphan = true, desc = "xdg-open", for = "linux" },
]

[open]
rules = [
  { mime = "inode/directory", use = "folder" },

  { mime = "text/*", use = "text" },
  { mime = "image/*", use = "image" },
  { mime = "video/*", use = "video" },
  { mime = "application/octet-stream", use = "video" },
  { mime = "audio/*", use = "audio" },
  { mime = "inode/x-empty", use = "text" },
  { mime = "application/json", use = "text" },

  { mime = "application/zip", use = "archive" },
  { mime = "application/gzip", use = "archive" },
  { mime = "application/x-bzip", use = "archive" },
  { mime = "application/x-bzip2", use = "archive" },
  { mime = "application/x-tar", use = "archive" },
  { mime = "application/x-7z-compressed", use = "archive" },
  { mime = "application/x-rar", use = "archive" },
  { mime = "application/pdf", use = "document" },
  { mime = "application/epub+zip", use = "document" },
  { mime = "application/x-mobipocket-ebook", use = "document" },

  { mime = "*", use = "fallback" },
]

[plugin]
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]

prepend_preloaders = [
  { url = "/run/user/1000/gvfs/**/*", run = "noop" },
  { url = "/run/media/USER_NAME/**/*", run = "noop" },

  { mime = "application/subrip", run = "mediainfo" },
  { mime = "{audio,video,image}/*", run = "mediainfo" },

  { url = "*.docx", run = "office" },
  { mime = "application/ms-*", run = "office" },
  { mime = "application/msword", run = "office" },
  { mime = "application/oasis.opendocument.*", run = "office" },
  { mime = "application/openxmlformats-officedocument.*", run = "office" },
]

prepend_previewers = [
  { url = "*/", run = "eza-preview" },

  { url = "*.md", run = "glow" },

  { mime = "application/subrip", run = "mediainfo" },
  { mime = "{audio,video,image}/*", run = "mediainfo" },

  { url = "*.docx", run = "office" },
  { mime = "application/ms-*", run = "office" },
  { mime = "application/msword", run = "office" },
  { mime = "application/oasis.opendocument.*", run = "office" },
  { mime = "application/openxmlformats-officedocument.*", run = "office" },

  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch --archive-icon='🗄️ ' --show-file-icons" },

  { url = "*/", run = "folder", sync = true },
  { url = "/run/user/1000/gvfs/**/*", run = "noop" },
  { url = "/run/media/USER_NAME/**/*", run = "noop" },
]
